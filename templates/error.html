<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ComicCraft Error</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <main class="shell center-page">
    <section class="card">
      <h1>Generation failed</h1>
      <p class="error">{{ error }}</p>
      <p>Check your <code>.env</code> API key and terminal error, then try again.</p>
      <a class="primary button" href="/">Back to ComicCraft</a>
    </section>
  </main>
</body>
</html>
